# Patterns are JavaScript regexes — no inline (?i) flags allowed, so
# case-insensitivity is expressed with character-class alternatives.
bug:
  - '\b([Bb]ug|[Cc]rash|[Ee]rror|[Bb]roken|[Ff]ail(s|ed|ing)?|[Rr]egression)\b'
  - '\b([Ss]tack ?[Tt]race|[Ee]xception|[Pp]anic|[Dd]oesn''t work|[Dd]oes not work)\b'

enhancement:
  - '\b([Ff]eature|[Ee]nhancement|[Rr]equest|[Aa]dd support|[Pp]lease add)\b'
  - '\b([Ww]ould be nice|[Ff]eature request|[Pp]roposal|[Ii]t would be great)\b'

question:
  - '\b([Qq]uestion|[Hh]ow (do|can) [Ii]|[Hh]elp)\b'
  - '\b([Ii]s it possible)\b'

decoder:
  - '\b([Dd]ecod(er|e|ing)|[Pp]acket|[Hh]ash|[Pp]ayload)\b'
  - '\b([Mm]eshcore packet|[Cc]ontent ?[Hh]ash|[Aa][Ee][Ss])\b'

ingestor:
  - '\b([Ii]ngestor|[Mm][Qq][Tt][Tt]|[Bb]roker)\b'
  - '\b([Oo]bserver)\b'

frontend:
  - '\b([Uu][Ii]|[Ff]rontend|[Rr]eact|[Mm]ap|[Dd]ashboard)\b'
  - '\b([Bb]rowser|[Mm]aplibre|ui bug)\b'

docker:
  - '\b([Dd]ocker|[Cc]ompose|[Cc]ontainer|[Cc]addy|[Nn][Gg][Ii][Nn][Xx])\b'
  - '\b([Dd]ocker compose)\b'
