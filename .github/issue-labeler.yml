bug:
  - '(?i)\b(bug|crash|error|broken|fail(s|ed|ing)?|regression)\b'
  - '(?i)\b(stack ?trace|exception|panic|doesn''t work|does not work)\b'

enhancement:
  - '(?i)\b(feature|enhancement|request|add support|please add)\b'
  - '(?i)\b(would be nice|feature request|proposal|it would be great)\b'

question:
  - '(?i)\b(question|how (do|can) i|help)\b'
  - '(?i)\b(is it possible)\b'

decoder:
  - '(?i)\b(decod(er|e|ing)|packet|hash|payload)\b'
  - '(?i)\b(meshcore packet|content ?hash|aes)\b'

ingestor:
  - '(?i)\b(ingestor|mqtt|broker)\b'
  - '(?i)\b(observer)\b'

frontend:
  - '(?i)\b(ui|frontend|react|map|dashboard)\b'
  - '(?i)\b(browser|maplibre|ui bug)\b'

docker:
  - '(?i)\b(docker|compose|container)\b'
  - '(?i)\b(docker compose|caddy|nginx)\b'
