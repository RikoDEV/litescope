[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

; No GOMEMLIMIT by default. The server holds the whole packet history in RAM,
; so its live heap depends on traffic and retentionDays — a fixed soft limit
; below that live heap makes the Go GC run back to back (up to ~50% of all
; cores) without ever freeing enough, which pinned the container at constant
; high CPU. If you do set one (e.g. environment=GOMEMLIMIT="3GiB" under
; [program:server]), keep it well above the server's steady-state RSS
; (grep VmRSS /proc/<pid>/status) and below the container mem_limit. To bound
; memory itself, set retentionDays in config.json.
[program:ingestor]
command=/app/ingestor -config /app/config.json
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:server]
command=/app/server -config /app/config.json
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
