[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

; GOMEMLIMIT is a soft heap target for the Go GC, sized for the default 2g
; backend container (docker-compose mem_limit). The server holds the whole
; packet history in RAM, so it gets the bulk; the ingestor is small. Lower both
; if you shrink mem_limit. With the cap in place you can also trade RAM for
; fewer GC cycles (less CPU) by raising GOGC, e.g. GOGC="200".
[program:ingestor]
environment=GOMEMLIMIT="256MiB"
command=/app/ingestor -config /app/config.json
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:server]
environment=GOMEMLIMIT="1536MiB"
command=/app/server -config /app/config.json
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
